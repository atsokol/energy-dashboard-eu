name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Weekly rebuild on Mondays after the day-ahead auction: SDAC results are out ~12:45 CET and
    # entsoemcp.com usually lands them within 1-3 hours. Cron is UTC and ignores DST: 15:30 UTC is
    # 16:30 CET / 17:30 CEST, so Tuesday's prices are normally in the build.
    - cron: "30 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A normal build takes ~5 min; a first download of new zones under rate limiting ~20-30 min.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Carries the last good aggregated snapshot between runs. The committed cache/*.csv is the
      # floor; this restores anything fresher, so a build that meets an entsoemcp.com outage or
      # rate limit still publishes recent data. cache/raw/ is excluded: it is per-build scratch.
      # cache/residual/ also saves the residual-load loader from re-downloading ~500 MB of hourly
      # generation: it only fetches the weeks after its snapshot. cache/gen-hourly/ does the same
      # for the hourly generation-mix loader.
      # Restore and save are separate steps so the downloads are kept even when a later step fails
      # or the run is cancelled (actions/cache saves only after a fully successful job). Without
      # that, a failed first build of new zones repeats every download and runs into rate limits.
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            cache/*.csv
            cache/gen-profiles.zones
            cache/residual/*.csv
            cache/gen-hourly/*.csv
          key: dam-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dam-

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Save data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            cache/*.csv
            cache/gen-profiles.zones
            cache/residual/*.csv
            cache/gen-hourly/*.csv
          key: dam-${{ github.run_id }}-${{ github.run_attempt }}

      # The site rebuilds unattended every week. Without a check between build and deploy, an
      # upstream schema change would publish a blank dashboard silently.
      - name: Smoke-test the rendered charts
        run: |
          npm test
          HARNESS_WIDTH=400 npm test

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
